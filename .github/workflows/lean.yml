name: Lean verification
on:
  pull_request:
    paths: ['formal/**', '.github/workflows/lean.yml']
  push:
    branches: [main]
    paths: ['formal/**', '.github/workflows/lean.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: formal
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch locked dependencies and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lake --version
          lake exe cache get
          git diff --exit-code -- lake-manifest.json lean-toolchain
      - name: Check proof and record axioms
        shell: bash
        run: |
          set -euo pipefail
          lake build
          lake env lean Zetral.lean 2>&1 | tee "$RUNNER_TEMP/zetral-axioms.log"
          python3 - "$RUNNER_TEMP/zetral-axioms.log" <<'PY'
          import re, sys
          text = open(sys.argv[1]).read()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          names = ["reciprocal_transfer", "trial_leakage", "trial_leakage_sq",
                   "rayleigh_defect", "direct_ritz_transfer"]
          for name in names:
              m = re.search(r"'Zetral\." + name + r"' depends on axioms: \[([^\]]*)\]", text)
              if m:
                  axioms = {x.strip() for x in m.group(1).split(",") if x.strip()}
                  assert axioms <= allowed, (name, axioms)
              else:
                  assert f"'Zetral.{name}' does not depend on any axioms" in text, name
          assert "sorryAx" not in text
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-axiom-report
          path: ${{ runner.temp }}/zetral-axioms.log
          if-no-files-found: warn
