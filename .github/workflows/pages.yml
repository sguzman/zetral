name: Publish research site
on:
  push:
    branches: [main]
    paths: ['site/**', 'papers/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile research manuscript
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra
          mkdir -p /tmp/zetral-paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=/tmp/zetral-paper papers/theta-cardinal-bound.tex
          cp /tmp/zetral-paper/theta-cardinal-bound.pdf site/theta-cardinal-bound.pdf
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
